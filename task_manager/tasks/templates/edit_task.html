{% extends 'main.html' %}
{% load static %}

{% block title %}Edit Task{% endblock %}

{% block content %}
<h1>Edit Task</h1>
{% block extra_head %}<link rel="stylesheet" href="{% static 'css/edit.css' %}">{% endblock %}

<div class="text">
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="btns">
            <a href="{% url 'task_list' %}" class="back-btn">Back</a>
            <button class="submit-btn" >Submit</button>
        </div>
    </form>
</div>


{% endblock %}
