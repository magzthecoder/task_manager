{% extends 'main.html' %}
{% load static %}

{% block title %}Add Task{% endblock %}

{% block content %}
<h1>Add Task</h1>
{% block extra_head %}<link rel="stylesheet" href="{% static 'css/add.css' %}">{% endblock %}
<div class="text">
    <form method="POST">
        {% csrf_token %}
        <p>Category: {{ form.category }} <a href="{% url 'add_category'  %}">Add Category</a> <br> </p>
        <p>{{ form.title }}<br></p>
        <p>{{ form.description }}<br></p>

        <div class="btns">
            <a href="{% url 'task_list' %}" class="back-btn">Back</a>
            <button class="submit-btn" button>Submit</button>
        </div>
    </form>
</div>



{% endblock %}
