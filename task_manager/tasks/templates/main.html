<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recipe Book{% endblock %}</title>
     
<body>
    {% if messages %}
        <div class="alert alert-primary" role="alert">
            {% for message in messages %}
                <p class="mb-0">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
</head>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
