{% extends 'main.html' %}
{% load static %}

{% block title %} Delete {% endblock %}

{% block content %}
<h1>Delete Task</h1>
{% block extra_head %}<link rel="stylesheet" href="{% static 'css/delete.css' %}">{% endblock %}

<div class="delete-container">
    <h1>Delete</h1>
    <p>Are you sure you want to delete {{ task.title }}</p>
    <form method="POST">
        {% csrf_token %}
        
        <div class="btn">
            <a href="{% url 'task_detail' pk=task.pk %}" class="back-btn">Back</a>
            <button class="submit-btn">Confirm</button>
        </div>
    </form>
</div>
{% endblock %}
