{% extends 'main.html' %}
{% load static %}

{% block title %}Task List{% endblock %}

{% block content %}

<h1>My Tasks</h1>
{% block extra_head %}<link rel="stylesheet" href="{% static 'css/list.css' %}">{% endblock %}

<div class="log-container"> 
     <nav>
        {% if user.is_authenticated %} 
            <p class="wel-text">Welcome, {{ user.username }}!</p>
            <div class="actions"> 
                <a href="{% url 'logout_page' %}" class="logout-link">Logout</a> 
                <a href="{% url 'add_task' %}" class="add-link">Add</a>
            </div> 
        {% else %} 
            <a href="{% url 'login_page' %}">Login</a> 
            <a href="{% url 'register_page' %}">Register</a> 
        {% endif %} 
     </nav>
</div>

<div class="task">
    <ul class="text" id="task-list">
    </ul>
</div>

<script src="{% static 'js/task_list.js' %}" defer></script>

{% endblock %}
